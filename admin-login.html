<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход в админку</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#0f172a;
}
.card{background:#fff;border-radius:18px;padding:32px;width:100%;max-width:380px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
h1{font-size:1.35rem;margin:0 0 6px;letter-spacing:-.02em}
.sub{font-size:.86rem;color:#64748b;margin:0 0 24px}
label{display:block;font-size:.82rem;font-weight:600;color:#475569;margin-bottom:6px}
input{
  width:100%;padding:13px 15px;border:1.5px solid #e2e8f0;border-radius:11px;
  font-size:1rem;font-family:inherit;margin-bottom:16px;transition:.15s;
}
input:focus{outline:none;border-color:#1d63d3;box-shadow:0 0 0 3px #e8f0fe}
button{
  width:100%;padding:14px;border:0;border-radius:11px;background:#1d63d3;color:#fff;
  font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;
}
button:hover{background:#1550b0}
button:disabled{opacity:.6;cursor:default}
.err{
  background:#fee2e2;color:#b91c1c;font-size:.84rem;padding:10px 14px;border-radius:9px;
  margin-bottom:14px;display:none;
}
.err.show{display:block}
.back{display:block;text-align:center;margin-top:18px;font-size:.85rem;color:#64748b;text-decoration:none}
.back:hover{color:#1d63d3}
</style>
</head>
<body>
<div class="card">
  <h1>Вход в админку</h1>
  <p class="sub">Заявки с сайта натяжных потолков</p>
  <div class="err" id="err"></div>
  <form id="loginForm">
    <label for="login">Логин</label>
    <input type="text" id="login" name="login" value="admin" autocomplete="username" required>
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    <button type="submit" id="submitBtn">Войти</button>
  </form>
  <a href="/" class="back">&larr; На сайт</a>
</div>
<script>
const form = document.getElementById('loginForm');
const err = document.getElementById('err');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Проверяем…';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        login: form.login.value,
        password: form.password.value,
      }),
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      location.href = '/admin';
    } else {
      err.textContent = data.error || 'Неверный логин или пароль';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  } catch (e) {
    err.textContent = 'Нет связи с сервером';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Войти';
  }
});
</script>
</body>
</html>
